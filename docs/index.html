<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>Impeccable 5.2</title>
<meta name="description" content="Write flawlessly. A distraction-free Markdown word processor in the spirit of WordPerfect 5.1 for DOS.">
<meta name="theme-color" content="#0000AA">
<meta name="color-scheme" content="dark">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preload" href="fonts/vt323-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <nav id="menubar" hidden aria-label="Menu bar"></nav>
  <div id="menu-drop" hidden role="menu"></div>
  <main id="editor"></main>
  <footer id="status" aria-live="polite">
    <div id="prompt" hidden></div>
    <span id="status-left"></span>
    <span id="status-right"></span>
  </footer>
  <nav id="template" hidden aria-label="Keyboard template"></nav>
</div>
<section id="screen" hidden></section>
<input type="file" id="file-input" accept=".md,.markdown,.txt,text/markdown,text/plain" hidden>
<div id="print-area"></div>
<noscript><p style="color:#fff;padding:1em">Impeccable needs JavaScript to run.</p></noscript>
<script type="module" src="app.js"></script>
</body>
</html>
